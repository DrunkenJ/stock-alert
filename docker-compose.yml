version: "3.8"

services:
  stock-alert:
    build: .
    container_name: stock-alert-bot
    restart: unless-stopped
    network_mode: host

    environment:
      - TZ=Asia/Seoul

    env_file:
      - .env

    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./src:/app/src
      - ./main.py:/app/main.py
      - ./run_backtest.py:/app/run_backtest.py

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
