version: "3.8"

services:
  stock-alert:
    build:
      context: .
      # 이 NAS 는 도커 브리지 네트워크에서 DNS 가 동작하지 않아 빌드 중 pip 가
      # "Temporary failure in name resolution" 으로 죽는다. 호스트 네트워크로
      # 빌드해야 pypi 에 닿는다. (컨테이너 실행도 이미 network_mode: host 다)
      network: host
    container_name: stock-alert-bot
    restart: unless-stopped
    network_mode: host

    environment:
      - TZ=Asia/Seoul

    env_file:
      - .env

    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./src:/app/src
      - ./main.py:/app/main.py
      - ./run_backtest.py:/app/run_backtest.py

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
